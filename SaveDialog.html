<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <style>
    body, html {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        padding: 30px;
        border-radius: 8px;
        text-align: center;
    }

    .prompt {
        font-size: 1.2em;
        color: #333;
        margin-bottom: 50px;
    }

    .button-container {
        display: flex;
        gap: 40px;
        justify-content: center;
    }

    .button {
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1em;
        position: relative;
    }

    .submit-button {
        background-color: #5cb85c;
        color: white;
    }

    .submit-button:hover:not(:disabled) {
        background-color: #4cae4c;
    }

    .submit-button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
    }

    .cancel-button {
        background-color: #d9534f;
        color: white;
    }

    .cancel-button:hover:not(:disabled) {
        background-color: #c9302c;
    }

    .cancel-button:disabled {
        background-color: #cccccc;
        cursor: not-allowed;
    }

    /* Loading spinner styles */
    .spinner {
        width: 20px;
        height: 20px;
        border: 2px solid #ffffff;
        border-top: 2px solid transparent;
        border-radius: 50%;
        display: inline-block;
        animation: spin 1s linear infinite;
        margin-right: 8px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .loading-text {
        color: #666;
        margin-top: 20px;
        font-style: italic;
    }

    .hidden {
        display: none;
    }
  </style>
</head>
<body>
    <div class="container">
        <div class="prompt">Your metadata will be uploaded to the data commons. Once you select 'OK' please wait 2-5 minutes for changes to propagate within the system.</div>
        <div class="button-container">
            <button class="button submit-button" id="submitBtn" onclick="handleSubmit()">
                <span id="submitText">Submit</span>
            </button>
            <button class="button cancel-button" id="cancelBtn" onclick="google.script.host.close()">Cancel</button>
        </div>
        <div class="loading-text hidden" id="loadingText">Submitting file, please wait...</div>
    </div>

    <script>
      function handleSubmit() {
        // Get button elements
        const submitBtn = document.getElementById('submitBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const submitText = document.getElementById('submitText');
        const loadingText = document.getElementById('loadingText');
        
        // Disable buttons and show loading state
        submitBtn.disabled = true;
        cancelBtn.disabled = true;
        
        // Add spinner to submit button
        submitText.innerHTML = '<span class="spinner"></span>Submitting...';
        
        // Show loading message
        loadingText.classList.remove('hidden');
        
        google.script.run
          .withSuccessHandler(function(response) {
              console.log("Submission result:", response);
              
              // Hide loading state
              loadingText.classList.add('hidden');
              
              // Reset button state
              submitText.innerHTML = 'Submit';
              submitBtn.disabled = false;
              cancelBtn.disabled = false;
              
              alert(response); 
              if (response.startsWith("TSV file")) { 
                  google.script.host.close();
              }
          })
          .withFailureHandler(function(error) {
              console.error("Submission failed:", error);
              
              // Hide loading state
              loadingText.classList.add('hidden');
              
              // Reset button state
              submitText.innerHTML = 'Submit';
              submitBtn.disabled = false;
              cancelBtn.disabled = false;
              
              alert("Submission failed. Please try again. Error: " + error); 
          })
          .saveToS3();
        }
    </script>
  </body>
</html>
